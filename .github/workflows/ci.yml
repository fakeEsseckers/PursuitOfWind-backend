name: CI

# Every pull request and every push to main: lint, tests, the distribution, and the image built from it and started
# on a PostgreSQL. A push to main that passes all of that is then deployed to the staging (docs/adr/0003).
#
# The engine and the contract are read from the client repository's GitHub Packages with the workflow's own token,
# which is enough while those packages are public.
#
# Repository settings this reads, optional:
#   secret PACKAGES_TOKEN
#     a token with read:packages, used in place of the workflow's own; needed only if the packages become private
#   secret RAILWAY_TOKEN
#     the project token of the staging on Railway; without it the deploy step is skipped
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces the run of a pull request; every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check and image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      # A step cannot ask whether a secret exists, so the job says it here.
      HAS_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN != '' }}
      # The service of the Railway project that runs the server.
      RAILWAY_SERVICE: PursuitOfWind-backend
    services:
      # For the image step only: the image needs a database to start. The tests bring their own PostgreSQL.
      postgres:
        image: postgres:17
        env:
          # A throwaway password for a database that lives as long as this job.
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Check
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./scripts/check.sh

      - name: Build the image
        run: docker build --tag pursuitofwind-backend:ci .

      - name: Start the image and ask for its health
        run: |
          docker run --detach --name server --network host \
            --env DATABASE_URL=postgresql://postgres:ci-only@localhost:5432/postgres \
            pursuitofwind-backend:ci
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:8080/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs server
          exit 1

      - name: Deploy to the staging
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_RAILWAY_TOKEN == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # What the image is built from and nothing else: the Dockerfile and the distribution it packages, the one
          # the steps above have just tested.
          mkdir -p deploy/build/install
          cp Dockerfile deploy/
          cp -r build/install/server deploy/build/install/
          npm install --global @railway/cli@5.75.0
          # --no-gitignore: the repository ignores build/, which is exactly what the image needs.
          railway up deploy --path-as-root --no-gitignore --ci --service "$RAILWAY_SERVICE"

      - name: Say why nothing was deployed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_RAILWAY_TOKEN != 'true'
        run: echo "::notice::The secret RAILWAY_TOKEN is not set, so this commit was not deployed to the staging."
